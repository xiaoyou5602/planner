<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <filter id="hand" filterUnits="userSpaceOnUse" x="-10" y="-10" width="128" height="128">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="1" seed="4" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="1.2" result="smooth"/>
      <feDisplacementMap in="SourceGraphic" in2="smooth" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wash" filterUnits="userSpaceOnUse" x="-10" y="-10" width="128" height="128">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="108" height="108" fill="#f6fbff"/>
  <g transform="translate(54 55) scale(.86) translate(-54 -55)">
